// Size the parent iFrame		
   function iframeResize() {		
     var body = document.body,		
     html = document.documentElement;		
     var height = Math.min( body.scrollHeight, body.offsetHeight) + 25;		
     //parent.postMessage("resize::"+height,"*");		
     var json = '{"resizeFrame":{"frameHeight":' + Math.max(740,height) + ',"frameId":"iframeFaleConosco"}}';		
     parent.postMessage(json,"*");		
   }		

   window.onload = function() {		
     // Resize iframe		
     setInterval(iframeResize, 500);		
   };		
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const sendHeight = () => {
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ type: 'resize-iframe', height: height }, 'https://www.emdec.com.br');
  };

  sendHeight();

  window.addEventListener('resize', sendHeight);
  
  const observer = new MutationObserver(sendHeight);
  observer.observe(document.body, { attributes: true, childList: true, subtree: true });
});
</script>
